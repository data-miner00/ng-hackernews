<div class="read-later-page">
  <h1 class="story-page-heading">Read Later</h1>

  @if (stories.length > 0) {
    <div class="read-later-inner">
      @for (story of stories; track story) {
        <app-news-item
          [id]="story.id"
          [title]="story.title"
          [by]="story.by"
          [descendants]="story.descendants"
          [score]="story.score"
          [type]="story.type"
          [url]="story.url"
          [time]="story.time"
          [alreadyAdded]="true"
        ></app-news-item>
      }
    </div>
  } @else {
    <div class="nothing">
      <p>Looks like there is nothing in your list yet. Go add one!</p>
    </div>
  }
</div>
