<figure [ngClass]="{ inset: inset }">
  <picture>
    <source media="screen and (max-width: 600px)" [srcset]="src" />
    <img [src]="src" [alt]="description" />
  </picture>
  @if (description) {
    <figcaption [ngClass]="captionClass">
      <span>{{ description }}</span>
    </figcaption>
  }
</figure>
